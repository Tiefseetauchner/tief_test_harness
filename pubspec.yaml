name: tief_test_harness
description: A test harness framework for improving automation of integration tests on emulators
version: 0.1.1
repository: https://github.com/Tiefseetauchner/tief_test_harness

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^7.0.0
  riverpod: ^2.6.1
  build: ^2.4.0
  source_gen: ^2.0.0
  glob: ^2.0.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^6.0.0
  logging: ^1.3.0

