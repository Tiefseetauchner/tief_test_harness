name: tief_test_harness
description: A test harness framework for improving automation of integration tests on emulators
version: 0.2.0
repository: https://github.com/Tiefseetauchner/tief_test_harness

environment:
  sdk: ^3.9.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  analyzer: ^14.4.0
  riverpod: ^3.4.3
  build: ^4.0.11
  source_gen: ^4.3.0
  glob: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^6.0.0
  logging: ^1.3.0

dependency_overrides: 
  meta: 1.18.3
