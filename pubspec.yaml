name: tief_test_harness
description: >
  A test harness for Flutter integration tests, providing a way to define and run
  scenarios with shared setup and teardown logic, and to generate a registry of
  available harnesses for different target devices or emulators.
version: 0.1.0
repository: https://github.com/Tiefseetauchner/tief_test_harness

environment:
  sdk: ^3.12.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod: ^3.3.2
  build: ^4.0.6
  source_gen: ^4.2.3
  glob: ^2.1.3
  analyzer: ^12.1.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^6.0.0
  test: ^1.31.0
  build_test: ^3.5.16
  logging: ^1.3.0

